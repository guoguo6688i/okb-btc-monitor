name: OKB/BTC Signal Monitor

on:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次
  workflow_dispatch:  # 支持手动触发

env:
  TZ: Asia/Shanghai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache signal state
        uses: actions/cache@v4
        with:
          path: .okb_last_signal.json
          key: okb-signal-state-${{ github.run_id }}
          restore-keys: |
            okb-signal-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run signal check
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ENABLED: 'true'
        run: |
          python check_signal.py

      - name: Save signal state
        if: always()
        uses: actions/cache@v4
        with:
          path: .okb_last_signal.json
          key: okb-signal-state-${{ github.run_id }}
