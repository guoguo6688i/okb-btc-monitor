name: OKB/BTC Signal Monitor

on:
  schedule:
    # 每4小时检测一次；错开整点高峰（每小时的13分），显著降低排队延迟
    - cron: '13 */4 * * *'  # UTC 0:13,4:13,8:13,12:13,16:13,20:13（北京 8:13,12:13,16:13,20:13,0:13,4:13）
    # 每日报告兜底：UTC 4:43（北京 12:43），若 12:13 那次未发则补发，当天不漏
    - cron: '43 4 * * *'
  workflow_dispatch:  # 支持手动触发

env:
  TZ: Asia/Shanghai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache signal state
        uses: actions/cache@v4
        with:
          path: .okb_last_signal.json
          key: okb-signal-state-${{ github.run_id }}
          restore-keys: |
            okb-signal-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run signal check
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ENABLED: 'true'
        run: |
          python check_signal.py
